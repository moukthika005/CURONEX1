<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curonex - My Profile</title>

    <link rel="stylesheet" href="profile.css">
</head>

<body>

    <div class="profile-container">

        <div class="profile-card">

            <!-- Profile Picture -->
            <div class="profile-image">
                <img src="images/profile.png" alt="Profile Picture">
            </div>

            <h2>Profile Details</h2>

            <form action="#">

                <!-- Full Name -->
                <div class="input-box">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" placeholder="Enter your full name" required>
                </div>

                <!-- Phone Number -->
                <div class="input-box">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter your phone number" required>
                </div>

                <!-- Emergency Contact -->
                <div class="input-box">
                    <label for="emergency">Emergency Contact Number</label>
                    <input type="tel" id="emergency" placeholder="Enter emergency contact number" required>
                </div>

                <!-- Email -->
                <div class="input-box">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email address" required>
                </div>

                <!-- Address -->
                <h3>Address Details</h3>

                <div class="input-box">
                    <label for="house">Home / Flat No</label>
                    <input type="text" id="house" placeholder="Enter Home / Flat Number">
                </div>

                <div class="input-box">
                    <label for="street">Street Address</label>
                    <input type="text" id="street" placeholder="Enter Street Address">
                </div>

                <div class="input-box">
                    <label for="landmark">Landmark</label>
                    <input type="text" id="landmark" placeholder="Enter Landmark">
                </div>

                <div class="input-box">
                    <label for="city">City / Town</label>
                    <input type="text" id="city" placeholder="Enter City / Town">
                </div>

                <div class="input-box">
                    <label for="postal">Postal Code</label>
                    <input type="text" id="postal" placeholder="Enter Postal Code">
                </div>

                <button type="submit" class="save-btn">
                    <a href="../../User/Appointment/Appointment_Search_Page_Radha/appointment_search.html">Save Profile</a>
                </button>

            </form>

        </div>

    </div>

</body>

</html>
